<?xml version="1.0" encoding="UTF-8"?>
<!--
  Drift's app icon (task M9-4): three drifting waves on deep water, on the macOS icon grid
  (1024 canvas, 824 rounded square inset, corner radius 185).

  Regenerate the bundled set with:

      (cd src-tauri && cargo tauri icon icons/icon.svg)
      rm -rf src-tauri/icons/{android,ios,icon.ico,64x64.png,Square*Logo.png,StoreLogo.png}

  The second line drops the Windows, Android and iOS artefacts the tool also writes: Drift is
  macOS only (plan §0), and `cargo xtask` fails if any of them is committed (xtask::icons).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Drift</title>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5aa9f7"/>
      <stop offset="0.45" stop-color="#2f6fd6"/>
      <stop offset="1" stop-color="#14306e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#water)"/>
    <rect x="100" y="100" width="824" height="480" fill="url(#sheen)"/>

    <!-- Three waves, each drifting a little further left than the one above it. -->
    <g fill="none" stroke="#ffffff" stroke-width="74" stroke-linecap="round">
      <path opacity="0.97" transform="translate(0 0)"
            d="M -40 392 c 62.5 -78 187.5 -78 250 0 s 187.5 78 250 0 s 187.5 -78 250 0 s 187.5 78 250 0 s 187.5 -78 250 0"/>
      <path opacity="0.78" transform="translate(-64 0)"
            d="M -40 540 c 62.5 -78 187.5 -78 250 0 s 187.5 78 250 0 s 187.5 -78 250 0 s 187.5 78 250 0 s 187.5 -78 250 0"/>
      <path opacity="0.55" transform="translate(-128 0)"
            d="M -40 688 c 62.5 -78 187.5 -78 250 0 s 187.5 78 250 0 s 187.5 -78 250 0 s 187.5 78 250 0 s 187.5 -78 250 0"/>
    </g>
  </g>
</svg>
