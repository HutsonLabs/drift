[package]
name = "drift-app"
description = "Drift: a macOS RDP client for GNOME Remote Desktop 50+ (Tauri shell, SessionManager, windows/tabs, menus)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "drift-app"

[lib]
name = "drift_app"
path = "src/lib.rs"

[[bin]]
name = "drift-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
drift-core = { workspace = true, features = ["specta"] }
drift-rdp.workspace = true
drift-macos = { workspace = true, features = ["tauri"] }
objc2-app-kit = { workspace = true, features = ["NSWorkspace"] }
objc2-foundation = { workspace = true, features = ["NSString", "NSURL"] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = [] }
tauri-specta.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
