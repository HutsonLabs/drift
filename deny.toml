# cargo-deny policy (plan M0-6). Run via `cargo xtask ci` or `cargo deny --workspace check`.
# Any allowance beyond MIT/Apache/BSD/ISC/Zlib/Unicode is justified in
# docs/adr/M0-6-dependency-policy.md.

[graph]
targets = ["aarch64-apple-darwin"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Unmaintained-crate advisories fail only for Drift's *direct* dependencies; the
# transitive ones (via tauri/wry: paste, unic-*, …) are outside our control.
unmaintained = "workspace"
# Each ignore needs a justification in docs/adr/M0-6-dependency-policy.md.
ignore = [
  # rsa "Marvin" timing side channel on *private-key* operations; pulled in by
  # ironrdp-connector -> picky/sspi. Drift is a client that only performs RSA public-key
  # operations (certificate parsing, CredSSP public-key binding). See the M0-6 ADR.
  { id = "RUSTSEC-2023-0071", reason = "Drift holds no RSA private keys; public-key ops only (M0-6 ADR)" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # Weak (file-level) copyleft, used unmodified by tauri's dependency tree
  # (cssparser, selectors, dtoa-short, option-ext). See the M0-6 ADR.
  "MPL-2.0",
]
exceptions = []

[licenses.private]
# Drift's own crates (publish = false) are MIT; the vendored IronRDP path crates carry
# their own "MIT OR Apache-2.0" license fields.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  # GPL-family licensed crates are denied via the license allow-list above.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
