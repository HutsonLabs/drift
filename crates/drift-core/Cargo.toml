[package]
name = "drift-core"
description = "Pure core model for Drift: profiles, session state machine, contracts shared by all crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
## Derive `specta::Type` on IPC-facing types (enabled by drift-app for tauri-specta bindings).
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid.workspace = true
specta = { workspace = true, optional = true, features = ["uuid"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
