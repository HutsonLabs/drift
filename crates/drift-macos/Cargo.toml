[package]
name = "drift-macos"
description = "macOS platform layer for Drift: RemoteView NSView, cursor, occlusion, network/sleep monitoring, Keychain, Local Network errors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
## Thin helpers taking `tauri::WebviewWindow` (attach the RemoteView below the WKWebView,
## hide/show the webview). Enabled by drift-app.
tauri = ["dep:tauri"]
## AppKit window-group tests that need a real window server session with tabbing
## (plan M6-2: `cargo test -p drift-macos --features macos-ui-tests`).
macos-ui-tests = []

[dependencies]
drift-core.workspace = true
drift-input.workspace = true
ironrdp-graphics.workspace = true
ironrdp-pdu.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true
objc2.workspace = true
block2.workspace = true
dispatch2 = "0.3.1"
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-quartz-core = { workspace = true, features = ["objc2-core-foundation"] }
objc2-core-foundation.workspace = true
security-framework = "3.7"
tauri = { workspace = true, optional = true }

[dev-dependencies]
drift-testkit.workspace = true
proptest.workspace = true
tempfile.workspace = true

# AppKit smoke tests must run on the process main thread (views and windows are
# main-thread-only), so they use a tiny libtest-compatible harness (tests/support/harness.rs).
[[test]]
name = "appkit"
harness = false

[[test]]
name = "tabs_ui"
harness = false

[lints]
workspace = true
