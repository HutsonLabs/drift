[package]
name = "drift-render"
description = "Metal compositor for Drift: per-surface textures, BT.709 NV12 shader, CAMetalLayer presentation, golden harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
drift-core.workspace = true
drift-gfx.workspace = true
drift-video.workspace = true
tracing.workspace = true
thiserror.workspace = true
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString"] }
objc2-metal = { workspace = true, features = ["objc2-io-surface", "objc2-core-foundation"] }
objc2-quartz-core = { workspace = true, features = ["objc2-metal", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-video = { workspace = true, features = ["objc2-metal", "objc2-io-surface"] }
objc2-io-surface.workspace = true

[dev-dependencies]
drift-testkit.workspace = true
proptest.workspace = true

[lints]
workspace = true
