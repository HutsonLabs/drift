[package]
name = "drift-clipboard"
description = "Clipboard format mapping and CLIPRDR sync state for Drift; NSPasteboard adapter behind the macos feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `macos` is on by default so the workspace build (clippy, nextest, coverage) always compiles
# and smoke-tests the NSPasteboard adapter. Pure-only consumers can use
# `default-features = false`. See docs/adr/M5-1-clipboard-format-mapping.md.
default = ["macos"]
## NSPasteboard adapter (task M5-3).
macos = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]

[dependencies]
drift-core.workspace = true
serde.workspace = true
thiserror.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "bmp"] }
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true, features = ["NSString", "NSData", "NSArray", "NSDictionary"] }
objc2-app-kit = { workspace = true, optional = true, features = ["NSPasteboard", "NSBitmapImageRep", "NSImageRep"] }

[dev-dependencies]
drift-testkit.workspace = true
proptest.workspace = true

[lints]
workspace = true
